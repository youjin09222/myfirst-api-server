apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: class-8

resources:
- ../../base
- configmap.yaml

patches:
- path: patch-deployment.yaml
  target:
    kind: Deployment
    name: sk255-myfirst-api-server

# 이미지 tag만 갱신하고 싶을 때 (standalone kustomize CLI 필요):
#   cd kustomize/dev && kustomize edit set image \
#     skala-registry.skala-ai.com/class-8/sk255-webserver=skala-registry.skala-ai.com/class-8/sk255-webserver:<NEW_TAG>
images:
- name: skala-registry.skala-ai.com/class-8/sk255-webserver
  newName: skala-registry.skala-ai.com/class-8/sk255-webserver
  newTag: 1.0.kaniko-pod
